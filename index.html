<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Galactic Explorer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <script type="module">
        import init from "./pkg/galactic_explorer.js";

        async function start() {
            try {
                console.log("Initializing WASM...");
                await init();
                console.log("Galactic Explorer WASM initialized successfully!");
            } catch (err) {
                console.error("Error initializing Bevy WASM:", err);
            }
        }

        start();
    </script>
</body>
</html>
