[package]
name = "galactic_explorer_rendering"
version = "0.7.0"
edition = "2021"
description = "Rendering pipeline - PBR shaders, camera, lighting"

[dependencies]
galactic_explorer_core = { path = "../core" }
galactic_explorer_assets = { path = "../assets" }
bevy = { version = "0.13", features = ["jpeg", "png", "hdr", "bevy_pbr"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
thiserror = "1"
log = "0.4"